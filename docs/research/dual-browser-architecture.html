<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GH Image Peek browser architecture</title>
  <style>
    :root { color-scheme: light dark; font-family: var(--font-sans, system-ui, sans-serif); }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; color: var(--foreground); }
    figure { margin: 0; }
    .node { padding: 16px; text-align: center; }
    .name { margin: 0 0 6px; font-weight: 500; }
    .detail { margin: 0; color: var(--muted-foreground); overflow-wrap: anywhere; }
    .connector { height: 28px; width: 1px; margin: 0 auto; background: var(--border); }
    .build { padding: 12px 16px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); text-align: center; }
    .build p { margin: 0; }
    .outputs { display: grid; grid-template-columns: 1fr 1fr; position: relative; }
    .output { position: relative; padding: 28px 16px 16px; text-align: center; }
    .output::before { content: ''; position: absolute; top: 0; left: 50%; height: 18px; border-left: 1px solid var(--border); }
    .output + .output { border-left: 1px solid var(--border); }
    code { font-family: var(--font-mono, ui-monospace, monospace); }
    .verify { margin-top: 12px; padding: 16px 0; text-align: center; border-top: 1px solid var(--border); }
    .verify p { margin: 0; }
    @media (max-width: 440px) {
      .outputs { grid-template-columns: 1fr; }
      .output + .output { border-left: 0; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <figure aria-label="Proposed architecture: one shared viewer and build script generate separate Firefox and Chrome packages, verified by a common test suite in both engines.">
    <div class="node">
      <p class="name">One shared viewer</p>
      <p class="detail"><code>content.js</code> · <code>viewer.css</code> · icon assets</p>
      <p class="detail">Image detection · gallery · zoom · accessible controls</p>
    </div>
    <div class="connector" aria-hidden="true"></div>
    <div class="build">
      <p class="name">Small Node build script</p>
      <p class="detail">Common Manifest V3 settings + browser overrides</p>
    </div>
    <div class="outputs">
      <section class="output" aria-label="Firefox output">
        <p class="name">Firefox package</p>
        <p class="detail">Gecko ID, compatibility, privacy and update settings</p>
        <p class="detail"><code>dist/firefox/</code></p>
      </section>
      <section class="output" aria-label="Chrome output">
        <p class="name">Chrome package</p>
        <p class="detail">Raster manifest icons and Chrome store configuration</p>
        <p class="detail"><code>dist/chrome/</code></p>
      </section>
    </div>
    <div class="verify">
      <p class="name">One interaction suite, two browser engines</p>
      <p class="detail">Firefox + Chromium · installed-extension smoke checks</p>
    </div>
  </figure>
</body>
</html>
