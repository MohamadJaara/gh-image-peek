<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GH Image Peek · Image navigation wireframe</title>
<style>
  :root {
    color-scheme: light dark;
    --peek-text: var(--foreground, light-dark(#202124, #ededed));
    --peek-page: var(--background, light-dark(#ffffff, #161618));
    --peek-secondary: color-mix(in srgb, var(--peek-text) 68%, var(--peek-page));
    --peek-panel: color-mix(in srgb, var(--peek-page) 94%, var(--peek-text));
    --peek-control: color-mix(in srgb, var(--peek-page) 84%, var(--peek-text));
    --peek-line: color-mix(in srgb, var(--peek-page) 70%, var(--peek-text));
    --peek-image: color-mix(in srgb, var(--peek-page) 90%, var(--peek-text));
    --peek-dim: color-mix(in srgb, var(--peek-page) 88%, transparent);
    --peek-radius: var(--radius, 12px);
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  #peek-wireframe { color: var(--peek-text); font: 14px/1.5 var(--font-sans, system-ui, sans-serif); }
  #peek-wireframe * { box-sizing: border-box; }
  #peek-wireframe [hidden] { display: none !important; }
  #peek-wireframe button { font: inherit; color: inherit; cursor: pointer; }
  #peek-wireframe button:focus-visible { outline: 2px solid var(--peek-text); outline-offset: 4px; }
  #peek-wireframe .scene { position: relative; height: 594px; overflow: hidden; border: 1px solid var(--peek-line); border-radius: var(--peek-radius); background: var(--peek-page); }
  #peek-wireframe .pr-page { padding: 26px; }
  #peek-wireframe .repo { color: var(--peek-secondary); margin-bottom: 22px; }
  #peek-wireframe .pr-title { font-size: 22px; font-weight: 500; margin-bottom: 18px; }
  #peek-wireframe .pr-tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--peek-line); padding-bottom: 14px; }
  #peek-wireframe .comment { margin-top: 22px; border: 1px solid var(--peek-line); border-radius: 8px; padding: 18px; }
  #peek-wireframe .comment p { margin: 0 0 16px; }
  #peek-wireframe .reopen { border: 1px solid var(--peek-line); background: var(--peek-panel); padding: 32px 24px; border-radius: 6px; width: 100%; min-height: 180px; }
  #peek-wireframe .page-line { width: 82%; height: 9px; background: var(--peek-control); margin: 18px 0; border-radius: 3px; }
  #peek-wireframe .page-line.short { width: 58%; }
  #peek-wireframe .viewer { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--peek-dim); }
  #peek-wireframe .toolbar { display: flex; flex: 0 0 auto; align-items: center; gap: 12px; padding: 12px 16px; background: var(--peek-panel); border-bottom: 1px solid var(--peek-line); }
  #peek-wireframe .close { width: 44px; height: 44px; flex: 0 0 44px; border: 1px solid var(--peek-line); border-radius: 6px; background: transparent; font-size: 25px; }
  #peek-wireframe .heading { flex: 1; min-width: 0; }
  #peek-wireframe .heading strong { display: block; font-weight: 500; }
  #peek-wireframe .filename { display: block; color: var(--peek-secondary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #peek-wireframe .action { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 12px; border: 1px solid var(--peek-line); border-radius: 6px; background: transparent; white-space: nowrap; }
  #peek-wireframe .original { color: var(--peek-secondary); }
  #peek-wireframe .gallery { flex: 1; min-height: 0; display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; gap: 12px; padding: 22px 16px 8px; }
  #peek-wireframe .nav { width: 48px; height: 52px; border: 1px solid var(--peek-line); border-radius: 6px; background: var(--peek-panel); font-size: 26px; }
  #peek-wireframe .nav:disabled { opacity: .28; cursor: default; }
  #peek-wireframe .nav:not(:disabled):hover, #peek-wireframe .action:hover, #peek-wireframe .close:hover { background: var(--peek-control); }
  #peek-wireframe .stage { display: flex; min-width: 0; min-height: 0; height: 100%; align-items: center; overflow: hidden; touch-action: pan-y; }
  #peek-wireframe .image { position: relative; isolation: isolate; width: 100%; aspect-ratio: 8/5; max-height: 100%; margin: auto; display: grid; place-items: center; border: 1px solid var(--peek-line); border-radius: 4px; background: var(--peek-image); }
  #peek-wireframe .image::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top right, transparent calc(50% - .5px), var(--peek-line) 50%, transparent calc(50% + .5px)), linear-gradient(to bottom right, transparent calc(50% - .5px), var(--peek-line) 50%, transparent calc(50% + .5px)); opacity: .6; }
  #peek-wireframe .image-label { padding: 16px 20px; margin: 12px; background: var(--peek-image); text-align: center; }
  #peek-wireframe .image-label strong { display: block; font-size: 20px; font-weight: 500; }
  #peek-wireframe .image-source { display: block; color: var(--peek-secondary); font-size: 12px; margin-top: 4px; }
  #peek-wireframe .stage.actual { display: block; overflow: auto; }
  #peek-wireframe .stage.actual .image { width: 840px; height: 525px; max-height: none; }
  #peek-wireframe .footer { flex: 0 0 auto; padding: 16px 16px 20px; text-align: center; }
  #peek-wireframe .count { font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 500; }
  #peek-wireframe .scope { color: var(--peek-secondary); font-size: 12px; margin-top: 2px; }
  #peek-wireframe .hint { color: var(--peek-secondary); font-size: 12px; margin-top: 12px; }
  #peek-wireframe kbd { display: inline-block; border: 1px solid var(--peek-line); border-radius: 4px; padding: 0 5px; color: var(--peek-text); font: inherit; }
  @media (max-width: 540px) {
    #peek-wireframe .scene { height: 546px; }
    #peek-wireframe .toolbar { flex-wrap: wrap; gap: 8px; padding: 10px; }
    #peek-wireframe .heading { flex-basis: calc(100% - 64px); }
    #peek-wireframe .action { flex: 1; }
    #peek-wireframe .gallery { grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 6px; padding: 14px 8px 0; }
    #peek-wireframe .nav { width: 44px; height: 48px; }
    #peek-wireframe .image-label { padding: 8px; margin: 8px; }
    #peek-wireframe .image-label strong { font-size: 16px; }
    #peek-wireframe .footer { padding: 12px 10px 18px; }
  }
</style>
</head>
<body>
<div id="peek-wireframe">
  <div class="scene">
    <div class="pr-page" inert>
      <div class="repo">acme / dashboard</div>
      <div class="pr-title">Refine the settings experience <span>#42</span></div>
      <div class="pr-tabs"><span>Conversation</span><span>Files changed</span></div>
      <div class="comment">
        <p>Updated screenshots for the settings flow.</p>
        <button type="button" class="reopen">Open screenshot</button>
        <div class="page-line"></div><div class="page-line short"></div>
      </div>
    </div>
    <div class="viewer" role="dialog" aria-modal="true" aria-label="Image viewer wireframe">
      <div class="toolbar">
        <button class="close" type="button" aria-label="Close image viewer">×</button>
        <div class="heading"><strong>Image peek</strong><span class="filename">settings-after.png</span></div>
        <button class="action size" type="button">Actual size</button>
        <span class="action original">Open original ↗</span>
      </div>
      <div class="gallery">
        <button class="nav previous" type="button" aria-label="Previous image">←</button>
        <div class="stage">
          <div class="image" role="img" aria-label="Placeholder for the second image in the pull request">
            <div class="image-label"><strong class="image-title">Image 2</strong><span class="image-source">After · PR comment</span></div>
          </div>
        </div>
        <button class="nav next" type="button" aria-label="Next image">→</button>
      </div>
      <div class="footer">
        <div class="count" role="status" aria-live="polite">2 of 4</div>
        <div class="scope">Images loaded on this PR page</div>
        <div class="hint"><kbd>←</kbd> <kbd>→</kbd> to browse &nbsp; · &nbsp; <kbd>Esc</kbd> to close</div>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('peek-wireframe');
  const items = [
    { name: 'settings-before.png', source: 'Before · PR description' },
    { name: 'settings-after.png', source: 'After · PR comment' },
    { name: 'mobile-settings.png', source: 'Mobile layout · PR comment' },
    { name: 'empty-state.png', source: 'Empty state · PR comment' },
  ];
  const viewer = root.querySelector('.viewer');
  const page = root.querySelector('.pr-page');
  const stage = root.querySelector('.stage');
  const previous = root.querySelector('.previous');
  const next = root.querySelector('.next');
  const size = root.querySelector('.size');
  const close = root.querySelector('.close');
  const reopen = root.querySelector('.reopen');
  let index = 1;
  let actual = false;
  let startX;
  let startY;
  let didSwipe = false;

  function render() {
    root.querySelector('.filename').textContent = items[index].name;
    root.querySelector('.image-title').textContent = `Image ${index + 1}`;
    root.querySelector('.image-source').textContent = items[index].source;
    root.querySelector('.image').setAttribute('aria-label', `Placeholder image ${index + 1}: ${items[index].name}`);
    root.querySelector('.count').textContent = `${index + 1} of ${items.length}`;
    previous.disabled = index === 0;
    next.disabled = index === items.length - 1;
    size.textContent = actual ? 'Fit to window' : 'Actual size';
    stage.classList.toggle('actual', actual);
    root.querySelector('.hint').innerHTML = actual
      ? '<kbd>←</kbd> <kbd>→</kbd> to pan &nbsp; · &nbsp; Screen arrows to browse'
      : '<kbd>←</kbd> <kbd>→</kbd> to browse &nbsp; · &nbsp; <kbd>Esc</kbd> to close';
  }
  function move(delta) {
    const target = Math.min(items.length - 1, Math.max(0, index + delta));
    if (target === index) return;
    index = target;
    actual = false;
    render();
    stage.scrollTo(0, 0);
  }
  function dismiss() {
    viewer.hidden = true;
    page.inert = false;
    reopen.focus({ preventScroll: true });
  }
  previous.addEventListener('click', () => move(-1));
  next.addEventListener('click', () => move(1));
  size.addEventListener('click', () => { actual = !actual; render(); stage.scrollTo(0, 0); });
  close.addEventListener('click', dismiss);
  reopen.addEventListener('click', () => { viewer.hidden = false; page.inert = true; close.focus({ preventScroll: true }); });
  viewer.addEventListener('click', (event) => {
    if (didSwipe) { didSwipe = false; return; }
    if (event.target === viewer || event.target === stage) dismiss();
  });
  stage.addEventListener('pointerdown', (event) => { startX = event.clientX; startY = event.clientY; didSwipe = false; });
  stage.addEventListener('pointerup', (event) => {
    if (actual || startX === undefined) return;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    startX = undefined;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      didSwipe = true;
      move(dx < 0 ? 1 : -1);
    }
  });
  document.addEventListener('keydown', (event) => {
    if (viewer.hidden) return;
    if (event.key === 'Escape') { event.preventDefault(); dismiss(); }
    if (!actual && ['ArrowLeft', 'ArrowRight'].includes(event.key)) {
      event.preventDefault();
      move(event.key === 'ArrowRight' ? 1 : -1);
    } else if (actual && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) {
      event.preventDefault();
      stage.scrollBy({
        left: event.key === 'ArrowRight' ? 64 : event.key === 'ArrowLeft' ? -64 : 0,
        top: event.key === 'ArrowDown' ? 64 : event.key === 'ArrowUp' ? -64 : 0,
      });
    }
  });
  render();
})();
</script>
</body>
</html>
