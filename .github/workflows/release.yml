name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or resume (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

# A pending Mozilla review must never cancel a release already in progress.
# The publisher also checks version ordering immediately before publication.
concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  build-and-sign:
    name: Build and sign
    if: github.repository == 'MohamadJaara/gh-image-peek'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.revision.outputs.tag }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the trusted tagged revision
        id: revision
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="${INPUT_TAG:-$PUSH_TAG}"
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected an existing stable version tag in the form vX.Y.Z.' >&2
            exit 1
          fi
          release_sha="$(git rev-parse --verify "refs/tags/$release_tag^{commit}")"
          git merge-base --is-ancestor "$release_sha" origin/main
          git checkout --detach "$release_sha"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          # Release artifacts must not depend on a cache writable by other runs.
          package-manager-cache: false
      - run: npm ci
      - run: npx --no-install playwright install --with-deps firefox chromium
      - run: npm run build
      - name: Validate release identity and version
        env:
          RELEASE_TAG: ${{ steps.revision.outputs.tag }}
        run: node scripts/release.mjs check "$RELEASE_TAG"
      - run: npm run lint
      - run: npm run lint:extension
      - run: npm test
      - name: Package the reviewable source
        run: node scripts/release.mjs source
      - name: Sign or retrieve the existing approved Firefox version
        env:
          RELEASE_TAG: ${{ steps.revision.outputs.tag }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          node scripts/amo.mjs --tag "$RELEASE_TAG" \
            --source-dir dist/firefox \
            --source-archive "dist/gh-image-peek-source-$version.zip" \
            --output dist/signed.xpi
      - name: Validate the signed package and stage release assets
        env:
          RELEASE_TAG: ${{ steps.revision.outputs.tag }}
        run: node scripts/release.mjs prepare "$RELEASE_TAG" dist/signed.xpi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
      - name: Save failed browser-test traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-browser-test-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish release
    needs: build-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Creates the draft, uploads assets, and publishes the release.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build-and-sign.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-release-assets
          path: dist/release/
      - name: Publish the complete release and check public downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-sign.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build-and-sign.outputs.sha }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG"
